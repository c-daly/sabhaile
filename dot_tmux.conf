unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g escape-time 0
set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:Tc'

# Claude Code in tmux (per its terminal-config docs): extended keys let Shift+Enter
# through as a newline; passthrough lets notifications / progress reach the terminal
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on

# Exiting a session's last shell switches to another session instead of detaching
set -g detach-on-destroy off

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# tmux-yank owns y / mouse-drag / prefix y / prefix Y; route them through win32yank
set -g @override_copy_command 'win32yank.exe -i --crlf'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# vim-tmux-navigator (plugin below) takes C-h/j/k/l; prefix C-l still clears the screen
bind C-l send-keys 'C-l'

# Floating scratch shell in the current directory; exit or C-d closes it
bind P display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# Pane borders show each pane's title (Claude Code / Codex set it to the current task)
set -g pane-border-status top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Morantron/tmux-fingers'

set -g @catppuccin_flavor 'mocha'
# Window flags in the status bar, incl. the bell Claude rings when it needs you
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_pane_status_enabled 'yes'
set -g @catppuccin_pane_default_text '##{pane_title}'

# catppuccin v2 draws no status modules unless placed here. Set before tpm runs so
# tmux-continuum can still prepend its auto-save hook to status-right.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
# Also relaunch Claude Code panes (matches `claude ...` only, not paths containing
# "claude"); --continue resumes the latest conversation in that pane's directory
set -g @resurrect-processes '"claude->claude --continue"'

# tmux-fingers (prefix F / prefix J): copy hints through win32yank like everything else.
# Its binary is installed by run_once_after_05-tmux.sh.tmpl.
set -g @fingers-main-action 'win32yank.exe -i --crlf'

run '~/.tmux/plugins/tpm/tpm'
